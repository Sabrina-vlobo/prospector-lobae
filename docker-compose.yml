services:
  db:
    image: postgres:17-alpine
    container_name: lobae-prospector-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lobae
      POSTGRES_PASSWORD: lobae
      POSTGRES_DB: prospector
    ports:
      # 5434 no host: a 5432 costuma ter um Postgres nativo e a 5433 outros projetos
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobae -d prospector"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
